# デザインシステム監査スキル

## 監査ルール
1. **カラーパレットの厳守:**
   - 独自の16進数カラー（例: `#ff8800`）を直接書かず、`css/style.css` の CSS 変数（`var(--color-primary)`, `var(--color-accent)` 等）を使用しているか。
2. **文字のコントラスト比:**
   - 背景色と文字色のコントラスト比が WCAG 2.1 AA 基準（4.5:1 以上）を満たしているか。
3. **レスポンシブ対応:**
   - モバイル表示時（幅768px未満）に横スクロールが発生していないか、タップ領域が最低 44x44px 確保されているか。

## 実行時の出力フォーマット
- 判定結果: [合格 / 要修正]
- 違反箇所の一覧（ファイル名、行番号、修正推奨コード）
